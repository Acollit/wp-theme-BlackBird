services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/starter-scss
      - ./plugins:/var/www/html/wp-content/plugins

  wp-cli:
    image: wordpress:cli
    depends_on:
      - wordpress
      - db
    volumes:
      - wp_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/starter-scss
      - ./plugins:/var/www/html/wp-content/plugins
      - ./bin/wp-init.sh:/wp-init.sh
    entrypoint: ["sh", "/wp-init.sh"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WP_URL: http://localhost:${WP_PORT:-8080}
      WP_TITLE: ${WP_TITLE:-Starter SCSS}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      THEME_SLUG: starter-scss

volumes:
  db_data:
  wp_data:
